[package]
name = "simpleedit-history"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Local History plugin of SimpleEdit"
license = "MIT"

[[bin]]
name = "history"
path = "src/main.rs"

[dependencies]
simpleedit-plugin = { git = "https://github.com/simple-edit-app/plugin-sdk", tag = "v0.4.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
