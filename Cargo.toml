[package]
name = "ardoise-history"
version = "1.1.2"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Local History plugin of Ardoise"
license = "MIT"

[[bin]]
name = "history"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.12.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
